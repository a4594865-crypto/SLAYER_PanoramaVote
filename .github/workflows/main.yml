name: Build Plugin (.NET 10)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        cache: true             
        cache-dependency-path: '**/SLAYER_PanoramaVote.csproj'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore --configuration Release /p:UseSharedCompilation=false /p:BuildInParallel=false

    # 🎯 【新增步驟】將編譯好的 .dll 檔案上傳，生成版本供人下載
    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SLAYER_PanoramaVote-Net10  # 這是你下載時看到的壓縮包名稱
        path: '**/bin/Release/net8.0/SLAYER_PanoramaVote.dll' # 這裡會抓取編譯出的插件本體
