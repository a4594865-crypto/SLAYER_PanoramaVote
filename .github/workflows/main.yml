name: Build Plugin (.NET 10)

on: [push, pull_request]

jobs:
  build:
    runs-runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # 🎯 已升級為 .NET 10
        cache: true             
        cache-dependency-path: '**/SLAYER_PanoramaVote.csproj'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore --configuration Release /p:UseSharedCompilation=false /p:BuildInParallel=false

    # 🎯 將編譯好的 .dll 檔案上傳
    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SLAYER_PanoramaVote-Net10  # 🎯 已改為 Net10 壓縮包名稱
        path: '**/bin/Release/net10.0/SLAYER_PanoramaVote.dll' # 🎯 路徑已對齊 net10.0
