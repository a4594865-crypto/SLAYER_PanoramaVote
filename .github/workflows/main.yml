name: Build Plugin (.NET 8)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # 🎯 已改為 8.0
        cache: true             
        cache-dependency-path: '**/SLAYER_PanoramaVote.csproj'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore --configuration Release /p:UseSharedCompilation=false /p:BuildInParallel=false

    # 🎯 將編譯好的 .dll 檔案上傳
    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SLAYER_PanoramaVote-Net8  # 🎯 改為 Net8 壓縮包名稱
        path: '**/bin/Release/net8.0/SLAYER_PanoramaVote.dll' # 🎯 路徑已對齊 net8.0
