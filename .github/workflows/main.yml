name: Build Plugin (.NET 10)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true             

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Project
      # 🚀 新增防死鎖參數：停用背景並行編譯，防止虛擬機記憶體死鎖轉圈圈
      run: dotnet build --no-restore --configuration Release /p:UseSharedCompilation=false /p:BuildInParallel=false
